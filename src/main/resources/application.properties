spring.config.import=optional:file:.env[.properties]
spring.application.name=appointment-management
spring.datasource.url=jdbc:postgresql://localhost:5432/appointment_management
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=true

# Charger la clé depuis la variable d'environnement JWT_SECRET_BASE64.
app.security.jwt.secret-base64=${JWT_SECRET_BASE64}

logging.level.org.springframework.security=DEBUG

# Affiche les informations utiles sur le traitement des requêtes HTTP.
logging.level.org.springframework.web=DEBUG

app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

spring.web.error.include-stacktrace=never