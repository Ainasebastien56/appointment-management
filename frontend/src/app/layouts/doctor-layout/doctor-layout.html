<div class="min-h-screen bg-page text-ink md:flex">

  <!-- Sidebar -->
  <aside class="flex w-full shrink-0 flex-col bg-sidebar text-white md:fixed md:inset-y-0 md:left-0 md:w-64">

    <!-- Official MediCare logo -->
    <a routerLink="/doctor-dashboard" class="flex items-center gap-3 px-6 py-6"
      aria-label="MediCare Doctor Dashboard">
      <span class="flex h-11 w-11 items-center justify-center rounded-xl bg-nav-active text-nav-active-ink">
        <svg viewBox="0 0 24 24" class="h-7 w-7" fill="none" stroke="currentColor" stroke-width="3"
          stroke-linecap="round" aria-hidden="true">
          <path d="M12 5v14M5 12h14" />
        </svg>
      </span>

      <span class="text-xl font-bold tracking-tight">MediCare</span>
    </a>

    <div class="mx-6 border-t border-white/15"></div>

    <!-- Navigation -->
    <nav aria-label="Doctor navigation" class="flex flex-1 flex-col gap-2 px-4 py-6">

      <p class="mb-2 px-3 text-xs font-semibold uppercase tracking-[0.16em] text-sidebar-muted">
        Doctor Portal
      </p>

      <a routerLink="/doctor-dashboard" routerLinkActive="!bg-nav-active !text-nav-active-ink"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-sidebar-ink transition hover:bg-white/10">
        <svg viewBox="0 0 24 24" class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1.5" />
          <rect x="14" y="3" width="7" height="7" rx="1.5" />
          <rect x="3" y="14" width="7" height="7" rx="1.5" />
          <rect x="14" y="14" width="7" height="7" rx="1.5" />
        </svg>
        <span>Dashboard</span>
      </a>

      <a routerLink="/doctor-appointments" routerLinkActive="!bg-nav-active !text-nav-active-ink"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-sidebar-ink transition hover:bg-white/10">
        <svg viewBox="0 0 24 24" class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="17" rx="2" />
          <path d="M16 2v4M8 2v4M3 9h18" />
          <path d="m9 14 2 2 4-4" />
        </svg>
        <span>Appointments</span>
      </a>

      <div class="mt-auto border-t border-white/15 pt-5">
        <button type="button" (click)="logout()"
          class="flex w-full items-center gap-3 rounded-xl px-4 py-3 text-left text-sm font-medium text-sidebar-ink transition hover:bg-white/10">
          <svg viewBox="0 0 24 24" class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10 17l5-5-5-5M15 12H3" />
            <path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6" />
          </svg>
          <span>Sign Out</span>
        </button>
      </div>
    </nav>

    <div class="hidden px-6 pb-5 text-xs text-sidebar-muted md:block">
      © 2026 MediCare
    </div>
  </aside>

  <!-- Main content -->
  <div class="min-w-0 flex-1 md:ml-64">
    <header
      class="sticky top-0 z-10 flex min-h-16 items-center justify-between border-b border-line bg-surface/95 px-5 py-3 backdrop-blur sm:px-8">
      <div>
        <p class="text-xs font-medium text-muted">
          MediCare / Doctor Portal
        </p>
      </div>

      <div class="flex items-center gap-3">
        <app-theme-toggle />
        <span class="rounded-full bg-surface-accent px-3 py-1.5 text-xs font-semibold text-accent">
          Doctor
        </span>
      </div>
    </header>

    <main class="min-w-0">
      <router-outlet />
    </main>
  </div>
</div>
